<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Rugg-pul Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #9945FF;
            --secondary: #14F195;
            --dark: #1B1B1B;
            --light: #F5F5F5;
            --error: #ff4949;
            --success: #14F195;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, #2a2a2a 100%);
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav-bar {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .wallet-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            background: rgba(255, 73, 73, 0.2);
            color: var(--error);
            padding: 8px 16px;
            border: 1px solid var(--error);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: var(--error);
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2.5em;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .subtitle {
            color: var(--secondary);
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .feature-card i {
            font-size: 2em;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .feature-card h3 {
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--light);
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(153, 69, 255, 0.2);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(153, 69, 255, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading i {
            color: var(--primary);
            font-size: 2em;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background: rgba(20, 241, 149, 0.1);
            border: 1px solid var(--success);
        }

        .result h3 {
            color: var(--success);
            margin-bottom: 10px;
        }

        .result p {
            margin: 5px 0;
        }

        .result a {
            color: var(--primary);
            text-decoration: none;
        }

        .result a:hover {
            text-decoration: underline;
        }

        .error-message {
            display: none;
            color: var(--error);
            background: rgba(255, 73, 73, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid var(--error);
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .card {
                padding: 20px;
            }
            
            .logo {
                font-size: 2em;
            }

            .nav-bar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fa-spinner {
            animation: spin 1s linear infinite;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <div class="wallet-info">
                <i class="fas fa-wallet"></i>
                <span id="walletAddress">{{ wallet_address }}</span>
            </div>
            <a href="/logout" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>

        <header class="header">
            <h1 class="logo">Solana Rugg-pul Creator</h1>
            <p class="subtitle">Create your custom token in minutes</p>
        </header>

        <div class="features">
            <div class="feature-card">
                <i class="fas fa-bolt"></i>
                <h3>Fast</h3>
                <p>Create tokens in seconds</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-shield-alt"></i>
                <h3>Secure</h3>
                <p>Built on Solana blockchain</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-dollar-sign"></i>
                <h3>Affordable</h3>
                <p>Low transaction fees</p>
            </div>
        </div>

        <div class="card">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Token Name</label>
                    <input type="text" id="name" placeholder="e.g., My Amazing Token" required>
                </div>
                <div class="form-group">
                    <label for="ticker">Token Symbol</label>
                    <input type="text" id="ticker" placeholder="e.g., MAT" maxlength="5" required>
                </div>
                <div class="form-group">
                    <label for="decimals">Decimals</label>
                    <input type="number" id="decimals" min="0" max="9" value="9" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Describe your token" required>
                </div>
                <div class="form-group">
                    <label for="image_link">Image URL</label>
                    <input type="text" id="image_link" placeholder="Enter image URL" required>
                </div>
            </div>

            <button onclick="createToken()" class="btn">Create Token</button>
            
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Creating your token...</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="result" id="result">
                <h3>Token Created Successfully! 🎉</h3>
                <p>Token Address: <span id="tokenAddress"></span></p>
                <p>View on: <a id="explorerLink" target="_blank">Solana Explorer</a></p>
            </div>
        </div>
    </div>

    <script>
        async function createToken() {
            const loading = document.querySelector('.loading');
            const result = document.querySelector('.result');
            const errorMessage = document.querySelector('.error-message');
            const button = document.querySelector('.btn');

            // Reset UI
            loading.style.display = 'none';
            result.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // Collect form data
            const data = {
                name: document.getElementById('name').value,
                ticker: document.getElementById('ticker').value,
                decimals: document.getElementById('decimals').value,
                description: document.getElementById('description').value,
                image_link: document.getElementById('image_link').value,
                walletAddress: document.querySelector('#walletAddress').textContent
            };

            // Validate inputs
            if (!data.name || !data.ticker || !data.description || !data.image_link) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }

            try {
                // Show loading state
                loading.style.display = 'block';
                button.disabled = true;

                const response = await fetch('/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result_data = await response.json();
                
                if (response.ok) {
                    // Update result section
                    document.getElementById('tokenAddress').textContent = result_data.token_address;
                    document.getElementById('explorerLink').href = result_data.explorer_url;
                    result.style.display = 'block';
                } else {
                    throw new Error(result_data.error || 'Failed to create token');
                }
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
